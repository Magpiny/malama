name: Malama Continuous Integration & Deployment (Arch Linux)
on:
  push:
    branches:
      - main
      - "release/*"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  build-test:
    name: Build & Test (Arch Linux baseline)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Initialize Arch Environment & Install Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            git cmake ninja pkgconf gcc \
            wxwidgets-gtk3 sqlite poppler \
            libarchive pugixml libpng libjpeg-turbo \
            spdlog boost boost-libs
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON
      - name: Build Targets
        run: cmake --build build --parallel $(nproc)
      - name: Execute Offline Test Suite
        run: |
          ctest --test-dir build --output-on-failure
  package-appimage:
    name: AppImage Assembly & Release Deployment
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:base-devel
    steps:
      - name: Initialize Arch Environment & Install Prerequisites
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            git cmake ninja pkgconf gcc \
            wxwidgets-gtk3 sqlite poppler \
            libarchive pugixml libpng libjpeg-turbo \
            spdlog boost boost-libs wget file
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Build Release Binary
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target malama --parallel $(nproc)
      - name: Build AppImage Bundle
        run: |
          chmod +x scripts/build_appimage.sh
          ./scripts/build_appimage.sh
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Malama-v*-x86_64.AppImage
            Malama-v*-x86_64.AppImage.zsync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
